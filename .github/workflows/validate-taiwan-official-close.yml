name: Validate Taiwan official post-close prices

on:
  workflow_dispatch:
    inputs:
      date:
        description: Optional Taiwan trade date (YYYY-MM-DD)
        required: false
        type: string
  schedule:
    # Long watcher: start before Taiwan closes and retry official sources after 13:30.
    - cron: '20 5 * * 1-5'

permissions:
  contents: write

concurrency:
  group: taiwan-official-close
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Long Watcher - Taiwan official close validation (13:20 to 18:00 Taipei time)
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          TZ: Asia/Taipei
        run: |
          set -uo pipefail
          validated_close=false
          target_date="${REQUESTED_DATE:-$(TZ=Asia/Taipei date +%F)}"
          target_path="data/official-close/tw/${target_date:0:4}/${target_date}.json"
          handoff_path="data/handoffs/taiwan-close/${target_date:0:4}/${target_date}.json"

          run_validate_and_commit() {
            for attempt in 1 2 3 4 5 6; do
              if ! git fetch origin main; then
                sleep "$((attempt * 2 + RANDOM % 3))"
                continue
              fi
              git reset --hard origin/main || true
              args=("--date=$target_date")
              if ! npm run validate:tw-official-close -- "${args[@]}"; then
                echo "Official Taiwan close is not available on attempt $attempt; retrying." >&2
                sleep "$((attempt * 3 + RANDOM % 4))"
                continue
              fi
              if [ ! -f "$target_path" ]; then
                echo "Official close validation did not produce $target_path." >&2
                sleep "$((attempt * 3 + RANDOM % 4))"
                continue
              fi
              handoff_ready=true
              if ! TAIWAN_CLOSE_HANDOFF_DATE="$target_date" npm run build:tw-close-handoff || [ ! -f "$handoff_path" ]; then
                echo "Verified Taiwan 13:30 close handoff is not available on attempt $attempt; retrying." >&2
                handoff_ready=false
              fi
              git add -- data/official-close/tw data/status/official-close/tw.json data/handoffs/taiwan-close 2>/dev/null || true
              if git diff --cached --quiet; then
                if [ "$handoff_ready" = 'true' ]; then
                  echo "Official Taiwan close and verified 13:30 handoff already exist for $target_date"
                  validated_close=true
                  return 0
                fi
                sleep "$((attempt * 3 + RANDOM % 4))"
                continue
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              if git commit -m "verify: Taiwan official post-close prices"; then
                if git push origin HEAD:main; then
                  echo "Successfully pushed available Taiwan close artifacts"
                  if [ "$handoff_ready" = 'true' ]; then
                    validated_close=true
                    return 0
                  fi
                fi
              fi
              sleep "$((attempt * 3 + RANDOM % 4))"
            done
            return 1
          }

          # These are verification retries only. The 13:30 market snapshot is
          # captured by its separate long-running Taiwan session watcher.
          for slot_time in "13:35" "13:50" "14:10" "14:30" "14:50" "15:10" "15:30" "15:50" "16:10" "16:30" "16:50" "17:10" "17:30" "17:50"; do
            while true; do
              current_time=$(TZ=Asia/Taipei date +%H:%M)
              if [[ "$current_time" > "$slot_time" || "$current_time" == "$slot_time" ]]; then
                break
              fi
              sleep 20
            done
            echo "Executing Taiwan official close validation slot at $slot_time Taipei time..."
            if run_validate_and_commit; then
              validated_close=true
              break
            fi
          done

          if [ "$validated_close" = 'true' ]; then
            echo "Taiwan official close validation completed without waiting for the watcher end."
            exit 0
          fi

          # Hold watcher active until 18:00 Taipei time (End time)
          while true; do
            current_time=$(TZ=Asia/Taipei date +%H:%M)
            if [[ "$current_time" > "18:00" || "$current_time" == "18:00" ]]; then
              break
            fi
            sleep 30
          done
          echo "Taiwan official close validation watcher completed at 18:00 Taipei time."
          if [ "$validated_close" != 'true' ]; then
            echo "No verified Taiwan official close archive was produced for $target_date." >&2
            exit 1
          fi

