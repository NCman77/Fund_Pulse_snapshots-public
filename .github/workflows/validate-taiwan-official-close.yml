name: Validate Taiwan official post-close prices

on:
  workflow_dispatch:
    inputs:
      date:
        description: Optional Taiwan trade date (YYYY-MM-DD)
        required: false
        type: string
  schedule:
    # Long Watcher Task: Boot at 16:30 Taipei time (08:30 UTC), run until 20:50 Taipei time.
    - cron: '30 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: taiwan-official-close
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Long Watcher - Taiwan official close validation (16:30 to 20:50 Taipei time)
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          TZ: Asia/Taipei
        run: |
          set -uo pipefail

          run_validate_and_commit() {
            for attempt in 1 2 3 4 5 6; do
              if ! git fetch origin main; then
                sleep "$((attempt * 2 + RANDOM % 3))"
                continue
              fi
              git reset --hard origin/main || true
              args=()
              if [ -n "${REQUESTED_DATE:-}" ]; then args+=("--date=$REQUESTED_DATE"); fi
              npm run validate:tw-official-close -- "${args[@]}" || true
              git add -- data/official-close/tw data/status/official-close/tw.json 2>/dev/null || true
              if git diff --cached --quiet; then
                echo "No official close changes to commit for attempt $attempt"
                break
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              if git commit -m "verify: Taiwan official post-close prices"; then
                if git push origin HEAD:main; then
                  echo "Successfully pushed official Taiwan close prices"
                  break
                fi
              fi
              sleep "$((attempt * 3 + RANDOM % 4))"
            done
          }

          # Target slots inside the 16:30-20:50 window: 20:00, 20:25, 20:45 Taipei time
          for slot_time in "20:00" "20:25" "20:45"; do
            while true; do
              current_time=$(TZ=Asia/Taipei date +%H:%M)
              if [[ "$current_time" > "$slot_time" || "$current_time" == "$slot_time" ]]; then
                break
              fi
              sleep 20
            done
            echo "Executing Taiwan official close validation slot at $slot_time Taipei time..."
            run_validate_and_commit
          done

          # Hold watcher active until 20:50 Taipei time (End time)
          while true; do
            current_time=$(TZ=Asia/Taipei date +%H:%M)
            if [[ "$current_time" > "20:50" || "$current_time" == "20:50" ]]; then
              break
            fi
            sleep 30
          done
          echo "Taiwan official close validation watcher completed at 20:50 Taipei time."

