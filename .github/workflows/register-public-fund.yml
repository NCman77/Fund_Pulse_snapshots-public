name: Register approved public fund

on:
  repository_dispatch:
    types: [fund-pulse-register-public-fund]

permissions:
  contents: write

concurrency:
  # Every registration rewrites the same approved-fund catalog.
  group: public-fund-registration
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate and register public fund
        env:
          PUBLIC_FUND_REGISTRATION_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node src/cli/register-public-fund.js
      - name: Validate public boundary
        run: npm run validate
      - name: Commit approved public fund
        env:
          PUBLIC_FUND_REGISTRATION_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          target="config/public-funds/approved-funds.json"
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            node src/cli/register-public-fund.js
            npm run validate
            if [ ! -e "$target" ] || git diff --quiet -- "$target"; then exit 0; fi
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$target"
            git commit -m "register: approved public fund"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 5))"
          done
          exit 1
