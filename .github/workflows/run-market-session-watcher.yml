name: Run public market session watcher

on:
  workflow_call:
    inputs:
      market:
        required: true
        type: string
      slots:
        required: true
        type: string
      session_name:
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: session-watch-${{ inputs.market }}-${{ inputs.session_name }}
      cancel-in-progress: false
    env:
      MARKET: ${{ inputs.market }}
      CAPTURE_SLOTS: ${{ inputs.slots }}
      SESSION_NAME: ${{ inputs.session_name }}
      CAPTURE_PRODUCER_ID: ${{ inputs.session_name }}
      CAPTURE_PRODUCER_ROLE: ${{ contains(inputs.session_name, 'backup') && 'backup' || 'primary' }}
      SESSION_WATCH_MAX_LATE_SECONDS: '120'
      SESSION_SLOT_MAX_ATTEMPTS: '3'
      SESSION_SLOT_RETRY_DELAY_SECONDS: '15'
      CAPTURE_MAX_DELAY_SECONDS: '120'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Capture and persist every approved session slot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          market_region="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const config = JSON.parse(readFileSync(`config/markets/${process.env.MARKET}.json`, "utf8")); process.stdout.write(config.region);')"
          raw_path="data/raw/$market_region/$MARKET/"
          session_status_path="data/status/sessions/$MARKET/"
          taiwan_close_handoff_path="data/handoffs/taiwan-close/"
          capture_commit_pending=0
          publisher_pending=0

          commit_snapshots() {
            # The aggregate health file is shared by market workflows. Each
            # watcher commits only its isolated immutable raw files and own report.
            git restore --worktree data/status/market-health.json 2>/dev/null || true
            # A session report is written only after the watcher finishes.  The
            # periodic checkpoint can therefore run before this directory
            # exists; `git add` would then abort with a pathspec error and
            # leave the captured snapshot unstaged.
            stage_if_present() {
              local path="$1"
              if [ -e "$path" ] || git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
                git add -A -- "$path"
              fi
            }

            stage_if_present "$raw_path"
            stage_if_present "$session_status_path"
            if [ "$MARKET" = 'tw' ]; then stage_if_present "$taiwan_close_handoff_path"; fi
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              if ! git commit -m "capture: $MARKET public session snapshot"; then
                return 1
              fi
              capture_commit_pending=1
            fi

            if [ "$capture_commit_pending" -eq 1 ]; then
              for push_attempt in 1 2 3 4 5 6; do
                if ! git fetch origin main; then
                  sleep "$((push_attempt * 2 + RANDOM % 3))"
                  continue
                fi
                # Watchers stage only producer-isolated raw and session report
                # paths. Merge remote progress before every push so a second
                # non-fast-forward race is retried instead of killing capture.
                if ! git merge --no-edit origin/main; then
                  git merge --abort 2>/dev/null || true
                  return 1
                fi
                if git push origin HEAD:main; then
                  capture_commit_pending=0
                  publisher_pending=1
                  break
                fi
                sleep "$((push_attempt * 2 + RANDOM % 3))"
              done
              if [ "$capture_commit_pending" -eq 1 ]; then
                git merge --abort 2>/dev/null || true
                return 1
              fi
            fi

            if [ "$publisher_pending" -eq 1 ]; then
              for dispatch_attempt in 1 2 3; do
                if gh workflow run publish-market-latest.yml -f market="$MARKET"; then
                  publisher_pending=0
                  return 0
                fi
                sleep "$((dispatch_attempt * 5))"
              done
              echo "Unable to dispatch the $MARKET latest publisher after three attempts" >&2
              return 1
            fi
            return 0
          }

          node src/cli/watch-market-session.js "$MARKET" --slots="$CAPTURE_SLOTS" &
          watcher_pid=$!
          while kill -0 "$watcher_pid" 2>/dev/null; do
            sleep 30
            if ! commit_snapshots; then
              echo "checkpoint persistence deferred for $MARKET; watcher remains active and the next checkpoint will retry" >&2
            fi
          done
          watcher_status=0
          wait "$watcher_pid" || watcher_status=$?
          if ! commit_snapshots; then
            echo "final capture flush failed for $MARKET" >&2
            exit 1
          fi
          if [ "$MARKET" = 'tw' ] && [ "$SESSION_NAME" = 's3' ]; then
            npm run build:tw-close-handoff || watcher_status=1
          fi
          exit "$watcher_status"
