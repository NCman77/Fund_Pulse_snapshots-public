name: Backup international decision-time public snapshots

on:
  workflow_dispatch:
  schedule:
    # This starts before the Taiwan 12:55 subscription decision point. The
    # reusable watchers stay alive until their own local 12:55-equivalent slot.
    - cron: '40 12 * * 1-5'
      timezone: Asia/Taipei

permissions:
  contents: write

jobs:
  japan:
    uses: ./.github/workflows/run-market-session-watcher.yml
    with:
      market: jp
      session_name: taipei-1255-backup
      # Asia/Tokyo is one hour ahead of Taipei.
      slots: '13:55'
  korea:
    uses: ./.github/workflows/run-market-session-watcher.yml
    with:
      market: kr
      session_name: taipei-1255-backup
      # Asia/Seoul is one hour ahead of Taipei.
      slots: '13:55'
