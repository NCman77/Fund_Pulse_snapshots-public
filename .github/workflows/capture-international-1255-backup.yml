name: Capture international decision-time public snapshots

on:
  workflow_dispatch:
  schedule:
    # This workflow is the sole owner of the JP/KR 13:55 decision slots.
    # It starts four hours before the 12:55 Taipei decision point.
    - cron: '55 8 * * 1-5'
      timezone: Asia/Taipei

permissions:
  contents: write

jobs:
  japan:
    uses: ./.github/workflows/run-market-session-watcher.yml
    with:
      market: jp
      session_name: decision-owner
      # Asia/Tokyo is one hour ahead of Taipei.
      slots: '13:55'
  korea:
    uses: ./.github/workflows/run-market-session-watcher.yml
    with:
      market: kr
      session_name: decision-owner
      # Asia/Seoul is one hour ahead of Taipei.
      slots: '13:55'
