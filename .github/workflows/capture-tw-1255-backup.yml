name: Capture Taiwan 12:55 decision public snapshot

on:
  workflow_dispatch:
  schedule:
    # This is the sole owner of 12:55.  It starts four hours early so a
    # GitHub Actions delay of up to three hours cannot miss the decision slot.
    - cron: '55 8 * * 1-5'
      timezone: Asia/Taipei

permissions:
  contents: write

jobs:
  watch:
    uses: ./.github/workflows/run-market-session-watcher.yml
    with:
      market: tw
      session_name: decision-owner
      slots: '12:55'
