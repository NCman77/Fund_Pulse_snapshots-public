name: Backup Taiwan 12:55 public snapshot

on:
  workflow_dispatch:
  schedule:
    # Independent GitHub-only standby for the only decision-time sample.
    - cron: '45 12 * * 1-5'
      timezone: Asia/Taipei

permissions:
  contents: write

jobs:
  watch:
    uses: ./.github/workflows/run-market-session-watcher.yml
    with:
      market: tw
      session_name: preorder-backup
      slots: '12:55'
