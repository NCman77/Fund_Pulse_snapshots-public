name: Archive daily public manifests

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1-5'
    - cron: '15 20 * * 1-5'
    - cron: '15 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: archive-public-markets
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Build manifests for completed sessions
        run: |
          for market_config in config/markets/*.json; do
            market="$(basename "$market_config" .json)"
            node src/cli/archive-market.js "$market"
          done
      - name: Commit daily manifests
        run: |
          if [ -z "$(git status --porcelain -- data/manifests/)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifests/
          git commit -m "archive: public daily manifests"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "Unable to publish public manifests after three attempts" >&2
          exit 1
