name: Capture approved public market snapshots

on:
  workflow_dispatch:
  schedule:
    # 30-minute research snapshots. The session resolver skips every market
    # that is outside its own local regular session.
    - cron: '5,35 0-21 * * 1-5'
    # Taiwan pre-order reference slots, expressed in UTC. These supplement the
    # 30-minute series; 01:05 UTC is already covered by the rule above.
    - cron: '0,30 2-5 * * 1-5'
    - cron: '55 4 * * 1-5'
    - cron: '25 5 * * 1-5'

permissions:
  contents: write

concurrency:
  group: snapshot-public-markets
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Capture open markets only
        env:
          CAPTURE_SCHEDULE_RULE: ${{ github.event.schedule }}
        run: |
          for market_config in config/markets/*.json; do
            market="$(basename "$market_config" .json)"
            node src/cli/capture-market.js "$market"
          done
      - name: Commit public snapshots
        run: |
          if [ -z "$(git status --porcelain -- data/raw/ data/latest/ data/status/)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/latest/ data/status/
          git commit -m "capture: approved public market snapshots"
          git push
