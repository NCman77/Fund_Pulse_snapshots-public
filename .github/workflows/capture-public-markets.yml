name: Capture public market snapshot (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot-public-markets-manual
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Synchronize immutable raw inputs before capture
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Capture open markets only
        env:
          CAPTURE_SCHEDULE_RULE: ${{ github.event.schedule }}
          CAPTURE_PRODUCER_ID: manual-fallback
          CAPTURE_PRODUCER_ROLE: backup
        run: |
          for market_config in config/markets/*.json; do
            market="$(basename "$market_config" .json)"
            node src/cli/capture-market.js "$market"
          done
      - name: Commit public snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          persist_immutable_snapshots() {
            for push_attempt in 1 2 3 4 5 6; do
              if ! git fetch origin main; then
                echo "Immutable raw push attempt $push_attempt could not fetch origin/main" >&2
              elif ! git merge --no-edit origin/main; then
                git merge --abort 2>/dev/null || true
                echo "Immutable raw snapshots conflict with origin/main; refusing to overwrite" >&2
                return 1
              elif git push origin HEAD:main; then
                return 0
              else
                echo "Immutable raw push attempt $push_attempt lost a branch race; retrying" >&2
              fi
              sleep "$((push_attempt * 3 + RANDOM % 4))"
            done
            echo "Unable to persist immutable raw snapshots after bounded retries" >&2
            return 1
          }
          dispatch_latest() {
            local market="$1"
            for dispatch_attempt in 1 2 3; do
              if gh workflow run publish-market-latest.yml -f market="$market"; then return 0; fi
              sleep "$((dispatch_attempt * 5))"
            done
            echo "Unable to dispatch the $market latest publisher after three attempts" >&2
            return 1
          }
          if [ -z "$(git status --porcelain -- data/raw/)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          git commit -m "capture: approved public market snapshots"
          persist_immutable_snapshots || exit 1
          for market_config in config/markets/*.json; do
            dispatch_latest "$(basename "$market_config" .json)" || exit 1
          done
