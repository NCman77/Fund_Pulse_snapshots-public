name: Capture public market snapshot (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-public-markets-manual
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Capture open markets only
        env:
          CAPTURE_SCHEDULE_RULE: ${{ github.event.schedule }}
        run: |
          for market_config in config/markets/*.json; do
            market="$(basename "$market_config" .json)"
            node src/cli/capture-market.js "$market"
          done
      - name: Commit public snapshots
        run: |
          if [ -z "$(git status --porcelain -- data/raw/ data/latest/ data/status/)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/latest/ data/status/
          git commit -m "capture: approved public market snapshots"
          git push
