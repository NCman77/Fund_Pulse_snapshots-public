name: Capture Taiwan public snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-tw
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run capture:tw
      - name: Commit approved snapshot changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/latest/ data/status/
          git commit -m "capture: tw public snapshot"
          git push

