name: Capture Taiwan public snapshot

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot-tw
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Synchronize immutable raw inputs before capture
        run: |
          git fetch origin main
          git reset --hard origin/main
      - run: npm run capture:tw
        env:
          CAPTURE_PRODUCER_ID: manual-tw-fallback
          CAPTURE_PRODUCER_ROLE: backup
      - name: Commit approved snapshot changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dispatch_latest() {
            for dispatch_attempt in 1 2 3; do
              if gh workflow run publish-market-latest.yml -f market=tw; then return 0; fi
              sleep "$((dispatch_attempt * 5))"
            done
            echo "Unable to dispatch the tw latest publisher after three attempts" >&2
            return 1
          }
          if [ -z "$(git status --porcelain -- data/raw/)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          git commit -m "capture: tw public snapshot"
          if ! git push origin HEAD:main; then
            git fetch origin main
            if ! git merge --no-edit origin/main || ! git push origin HEAD:main; then
              git merge --abort 2>/dev/null || true
              echo "Unable to merge the immutable Taiwan raw snapshot commit safely" >&2
              exit 1
            fi
          fi
          dispatch_latest
