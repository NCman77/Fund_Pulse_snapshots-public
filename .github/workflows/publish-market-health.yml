name: Publish aggregate market health

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggregate-market-health
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild aggregate health from per-market publisher reports
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm run publish:market-health
            git add -- data/status/market-health.json
            if git diff --cached --quiet; then exit 0; fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "publish: aggregate market health"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 5))"
          done
          exit 1
