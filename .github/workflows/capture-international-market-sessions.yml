name: Watch international public market sessions

on:
  workflow_dispatch:
    inputs:
      watch:
        description: all, jp-morning, jp-afternoon, kr-morning, kr-afternoon, cn-morning, cn-afternoon, sg-morning, sg-afternoon, uk-morning, uk-afternoon, eu-morning, eu-afternoon, us-morning, or us-afternoon
        required: true
        default: all
        type: string
  schedule:
    - cron: '31 8 * * 1-5'
      timezone: Asia/Tokyo
    - cron: '7 12 * * 1-5'
      timezone: Asia/Tokyo
    - cron: '32 8 * * 1-5'
      timezone: Asia/Seoul
    - cron: '8 12 * * 1-5'
      timezone: Asia/Seoul
    - cron: '3 9 * * 1-5'
      timezone: Asia/Shanghai
    - cron: '33 12 * * 1-5'
      timezone: Asia/Shanghai
    - cron: '33 8 * * 1-5'
      timezone: Asia/Singapore
    - cron: '34 12 * * 1-5'
      timezone: Asia/Singapore
    - cron: '31 7 * * 1-5'
      timezone: Europe/London
    - cron: '31 11 * * 1-5'
      timezone: Europe/London
    - cron: '34 8 * * 1-5'
      timezone: Europe/Paris
    - cron: '36 12 * * 1-5'
      timezone: Europe/Paris
    - cron: '4 9 * * 1-5'
      timezone: America/New_York
    - cron: '34 12 * * 1-5'
      timezone: America/New_York

permissions:
  contents: write

jobs:
  jp_morning:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '31 8 * * 1-5') || (github.event_name == 'workflow_dispatch' && (inputs.watch == 'all' || inputs.watch == 'jp-morning')) }}
    uses: ./.github/workflows/run-market-session-watcher.yml
    with:
      market: jp
      session_name: morning
      slots: 09:05,09:35,10:05,10:35,11:05,11:30
  jp_afternoon:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '7 12 * * 1-5') || (github.event_name == 'workflow_dispatch' && (inputs.watch == 'all' || inputs.watch == 'jp-afternoon')) }}
    uses: ./.github/workflows/run-market-session-watcher.yml
    with:
      market: jp
      session_name: afternoon
      slots: 12:35,13:05,13:35,14:05,14:35,15:05,15:30
  kr_morning:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '32 8 * * 1-5') || (github.event_name == 'workflow_dispatch' && (inputs.watch == 'all' || inputs.watch == 'kr-morning')) }}
    uses: ./.github/workflows/run-market-session-watcher.yml
    with:
      market: kr
