name: Watch international public market sessions

on:
  workflow_dispatch:
    inputs:
      watch:
        description: all or one segment id (for example jp_s1, uk_s4, us_s2)
        required: true
        default: all
        type: string
  schedule:
    # Every segment owns a disjoint set of slots.  Its runner starts at least
    # four hours before its first slot; minute values are globally unique so
    # github.event.schedule selects exactly one job in this workflow.
    - cron: '55 4 * * 1-5' # JP s1, Asia/Tokyo
      timezone: Asia/Tokyo
    - cron: '34 6 * * 1-5' # JP s2, Asia/Tokyo
      timezone: Asia/Tokyo
    - cron: '34 8 * * 1-5' # JP s3, Asia/Tokyo
      timezone: Asia/Tokyo
    - cron: '4 10 * * 1-5' # JP s4, Asia/Tokyo
      timezone: Asia/Tokyo
    - cron: '54 4 * * 1-5' # KR s1, Asia/Seoul
      timezone: Asia/Seoul
    - cron: '33 6 * * 1-5' # KR s2, Asia/Seoul
      timezone: Asia/Seoul
    - cron: '33 8 * * 1-5' # KR s3, Asia/Seoul
      timezone: Asia/Seoul
    - cron: '3 10 * * 1-5' # KR s4, Asia/Seoul
      timezone: Asia/Seoul
    - cron: '34 5 * * 1-5' # CN s1, Asia/Shanghai
      timezone: Asia/Shanghai
    - cron: '4 7 * * 1-5' # CN s2, Asia/Shanghai
      timezone: Asia/Shanghai
    - cron: '4 9 * * 1-5' # CN s3, Asia/Shanghai
      timezone: Asia/Shanghai
    - cron: '34 10 * * 1-5' # CN s4, Asia/Shanghai
      timezone: Asia/Shanghai
    - cron: '2 5 * * 1-5' # SG s1, Asia/Singapore
      timezone: Asia/Singapore
    - cron: '32 6 * * 1-5' # SG s2, Asia/Singapore
      timezone: Asia/Singapore
    - cron: '3 9 * * 1-5' # SG s3, Asia/Singapore
      timezone: Asia/Singapore
    - cron: '4 11 * * 1-5' # SG s4, Asia/Singapore
      timezone: Asia/Singapore
    - cron: '34 12 * * 1-5' # SG s5, Asia/Singapore
      timezone: Asia/Singapore
    - cron: '5 4 * * 1-5' # UK s1, Europe/London
      timezone: Europe/London
    - cron: '5 6 * * 1-5' # UK s2, Europe/London
      timezone: Europe/London
    - cron: '5 8 * * 1-5' # UK s3, Europe/London
      timezone: Europe/London
    - cron: '5 10 * * 1-5' # UK s4, Europe/London
      timezone: Europe/London
    - cron: '5 12 * * 1-5' # UK s5, Europe/London
      timezone: Europe/London
    - cron: '1 5 * * 1-5' # EU s1, Europe/Paris
      timezone: Europe/Paris
    - cron: '3 7 * * 1-5' # EU s2, Europe/Paris
      timezone: Europe/Paris
    - cron: '2 9 * * 1-5' # EU s3, Europe/Paris
      timezone: Europe/Paris
    - cron: '3 11 * * 1-5' # EU s4, Europe/Paris
      timezone: Europe/Paris
    - cron: '5 13 * * 1-5' # EU s5, Europe/Paris
      timezone: Europe/Paris
    - cron: '33 5 * * 1-5' # US s1, America/New_York
      timezone: America/New_York
    - cron: '33 7 * * 1-5' # US s2, America/New_York
      timezone: America/New_York
    - cron: '33 9 * * 1-5' # US s3, America/New_York
      timezone: America/New_York
    - cron: '33 11 * * 1-5' # US s4, America/New_York
      timezone: America/New_York

permissions:
  contents: write
  actions: write

jobs:
  jp_s1:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '55 4 * * 1-5') || (github.event_name == 'workflow_dispatch' && (inputs.watch == 'all' || inputs.watch == 'jp_s1')) }}
    uses: ./.github/workflows/run-market-session-watcher.yml
    with: { market: jp, session_name: s1, slots: '09:10,09:35,10:05' }
  jp_s2:
    uses: ./.github/workflows/run-market-session-watcher.yml
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '34 6 * * 1-5') || (github.event_name == 'workflow_dispatch' && (inputs.watch == 'all' || inputs.watch == 'jp_s2')) }}
    with: { market: jp, session_name: s2, slots: '10:35,11:05,11:30' }
  jp_s3:
    uses: ./.github/workflows/run-market-session-watcher.yml
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '34 8 * * 1-5') || (github.event_name == 'workflow_dispatch' && (inputs.watch == 'all' || inputs.watch == 'jp_s3')) }}
    with: { market: jp, session_name: s3, slots: '12:35,13:05,13:35' }
  jp_s4:
