name: Build Taipei 12:55 decision manifest

on:
  workflow_dispatch:
  schedule:
    # Wait for the independent Taiwan/Japan/Korea decision watchers to persist.
    - cron: '10 13 * * 1-5'
      timezone: Asia/Taipei

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build:decision-manifest
      - name: Commit decision manifest
        run: |
          if [ -z "$(git status --porcelain -- data/decision-snapshots/)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/decision-snapshots/
          git commit -m "capture: Taipei 12:55 decision manifest"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$((attempt * 5))"
          done
          exit 1
