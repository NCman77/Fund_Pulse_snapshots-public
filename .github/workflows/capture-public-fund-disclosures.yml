name: Capture approved public fund disclosures

on:
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: public-fund-disclosures
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run capture:funds
      - name: Commit public fund disclosures
        run: |
          if [ -z "$(git status --porcelain -- data/funds/ data/status/fund-disclosure-health.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funds/ data/status/fund-disclosure-health.json
          git commit -m "capture: approved public fund disclosures"
          git push

