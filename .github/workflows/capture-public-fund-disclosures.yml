name: Capture approved public fund disclosures

on:
  workflow_dispatch:
  schedule:
    # Preserve an as-of disclosure version before Taiwan's 12:55 decision slot.
    - cron: '20 0 * * 1-5'
    - cron: '35 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: public-fund-disclosures
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run capture:funds
      - run: npm run build:holding-coverage
      - name: Commit public fund disclosures
        run: |
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            npm run capture:funds && npm run build:holding-coverage
            git add -- data/funds/ data/status/fund-disclosure-health.json data/status/holding-mapping-health.json
            if git diff --cached --quiet; then exit 0; fi
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "capture: approved public fund disclosures"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 5))"
          done
          exit 1
