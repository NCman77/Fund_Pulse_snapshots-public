name: Capture approved public fund disclosures

on:
  workflow_dispatch:
  schedule:
    # Long Watcher Task: Boot at 14:40 Taipei time (06:40 UTC), run until 20:40 Taipei time.
    - cron: '40 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: public-fund-disclosures
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Long Watcher - Public fund disclosures capture (14:40 to 20:40 Taipei time)
        shell: bash
        env:
          TZ: Asia/Taipei
        run: |
          set -uo pipefail

          run_capture_and_commit() {
            for attempt in 1 2 3 4 5 6; do
              if ! git fetch origin main; then
                sleep "$((attempt * 2 + RANDOM % 3))"
                continue
              fi
              git reset --hard origin/main || true
              npm run capture:funds || true
              npm run build:holding-coverage || true
              git add -- data/funds/ data/status/fund-disclosure-health.json data/status/holding-mapping-health.json 2>/dev/null || true
              if git diff --cached --quiet; then
                echo "No disclosure changes to commit for attempt $attempt"
                break
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              if git commit -m "capture: approved public fund disclosures"; then
                if git push origin HEAD:main; then
                  echo "Successfully pushed public fund disclosures"
                  break
                fi
              fi
              sleep "$((attempt * 3 + RANDOM % 4))"
            done
          }

          # Target slots inside the 14:40-20:40 window: 16:35, 17:35, 18:35, 19:35, 20:35 Taipei time
          for slot_time in "16:35" "17:35" "18:35" "19:35" "20:35"; do
            while true; do
              current_time=$(TZ=Asia/Taipei date +%H:%M)
              if [[ "$current_time" > "$slot_time" || "$current_time" == "$slot_time" ]]; then
                break
              fi
              sleep 20
            done
            echo "Executing public fund disclosures capture slot at $slot_time Taipei time..."
            run_capture_and_commit
          done

          # Hold watcher active until 20:40 Taipei time (End time)
          while true; do
            current_time=$(TZ=Asia/Taipei date +%H:%M)
            if [[ "$current_time" > "20:40" || "$current_time" == "20:40" ]]; then
              break
            fi
            sleep 30
          done
          echo "Public fund disclosures watcher completed at 20:40 Taipei time."
