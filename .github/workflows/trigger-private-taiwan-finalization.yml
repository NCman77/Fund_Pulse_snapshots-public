name: Trigger private Taiwan finalization

run-name: Trigger private Taiwan finalization for ${{ inputs.business_date || 'current Taiwan date' }}

on:
  workflow_dispatch:
    inputs:
      business_date:
        description: Optional Taiwan trade date (YYYY-MM-DD)
        required: false
        type: string
  schedule:
    # This public runner owns the long wait that previously consumed private minutes.
    - cron: '10 7 * * 1-5'

permissions:
  contents: read

concurrency:
  group: public-taiwan-finalization-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Long watcher - notify the private finalizer at Taiwan NAV checkpoints
        shell: bash
        env:
          PRIVATE_REPO_ACTIONS_TOKEN: ${{ secrets.PRIVATE_REPO_ACTIONS_TOKEN }}
          REQUESTED_BUSINESS_DATE: ${{ inputs.business_date }}
          EVENT_NAME: ${{ github.event_name }}
          TZ: Asia/Taipei
        run: |
          set -euo pipefail

          if [ -z "${PRIVATE_REPO_ACTIONS_TOKEN:-}" ]; then
            echo "Missing PRIVATE_REPO_ACTIONS_TOKEN Actions secret." >&2
            exit 1
          fi

          business_date="${REQUESTED_BUSINESS_DATE:-$(TZ=Asia/Taipei date +%F)}"
          if [[ ! "$business_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Taiwan business date must use YYYY-MM-DD." >&2
            exit 1
          fi

          handoff_url="https://raw.githubusercontent.com/NCman77/Fund_Pulse_snapshots-public/main/data/handoffs/taiwan-close/${business_date:0:4}/${business_date}.json"
          dispatch_url="https://api.github.com/repos/NCman77/Fund_Pulse/actions/workflows/finalize-taiwan-daily-results.yml/dispatches"
          dispatched_any=false

          dispatch_private_finalization() {
            local attempt_slot="$1"
            local final_attempt="$2"
            local handoff_file
            handoff_file="$(mktemp)"

            if ! curl --fail --silent --show-error --location "$handoff_url" --output "$handoff_file"; then
              rm -f "$handoff_file"
              echo "Verified public Taiwan close handoff is not ready for $business_date at $attempt_slot." >&2
              return 1
            fi
            if ! jq -e --arg date "$business_date" \
              '.type == "taiwan_verified_close_handoff" and .market == "tw" and .date == $date' \
              "$handoff_file" >/dev/null; then
              rm -f "$handoff_file"
              echo "Public Taiwan close handoff failed its public identity check." >&2
              return 1
            fi
            rm -f "$handoff_file"

            payload="$(jq -cn \
              --arg ref main \
              --arg business_date "$business_date" \
              --arg attempt_slot "$attempt_slot" \
              --arg final_attempt "$final_attempt" \
              '{ref: $ref, inputs: {business_date: $business_date, attempt_slot: $attempt_slot, final_attempt: $final_attempt}}')"

            if ! curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $PRIVATE_REPO_ACTIONS_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$dispatch_url" \
              --data "$payload"; then
              echo "Failed to trigger the private Taiwan finalizer for $business_date at $attempt_slot." >&2
              return 1
            fi
            echo "Triggered the private Taiwan finalizer for $business_date at $attempt_slot."
            dispatched_any=true
          }

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            dispatch_private_finalization manual true
            exit 0
          fi

          current_time="$(TZ=Asia/Taipei date +%H:%M)"
          if [[ "$current_time" > "15:15" ]]; then
            dispatch_private_finalization delayed-start false || true
          fi

          for slot_time in "15:15" "16:00" "17:20" "18:20" "20:10" "20:25" "20:45" "21:00"; do
            current_time="$(TZ=Asia/Taipei date +%H:%M)"
            if [[ "$current_time" > "$slot_time" ]]; then
              continue
            fi
            while true; do
              current_time="$(TZ=Asia/Taipei date +%H:%M)"
              if [[ "$current_time" > "$slot_time" || "$current_time" == "$slot_time" ]]; then
                break
              fi
              sleep 20
            done
            final_attempt=false
            if [ "$slot_time" = '21:00' ]; then final_attempt=true; fi
            dispatch_private_finalization "$slot_time" "$final_attempt" || true
          done

          if [ "$dispatched_any" != 'true' ]; then
            echo "No private Taiwan finalization notification was sent for $business_date." >&2
            exit 1
          fi
